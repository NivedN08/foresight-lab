[project]
name = "foresight-lab"
version = "0.1.0"
description = "An AI research lab that cuts itself off at a date, locks in forecasts, and is graded by the real world."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["lab*"]
